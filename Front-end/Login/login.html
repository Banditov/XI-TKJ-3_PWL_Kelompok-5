<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>ATK SKI - Login</title>
        <link rel="icon" type="image/x-icon" href="/front-end/resources/image/logo.ico">
        <link rel="stylesheet" type="text/css" href="/front-end/login/style.css">
        <link rel="stylesheet" type="text/css" href="/front-end/globalStyle.css">
        <link rel="stylesheet" type="text/css" href="/front-end/login/responsiveStyle.css">
    </head>
    <body>
        <div id="loginBackground">
            <img src="/front-end/resources/image/login_background.png">
        </div>
        <div id="centerForm">
            <div class="loginForm">
                <b>Yuk, masuk untuk melanjutkan!</b>
                <form id="loginForm" action="/front-end/home/home.html">
                    <div class="inputForm">
                        <input type="email" id="email" class="inputField" placeholder="Email Sekolah" required>
                    </div>
                    <div class="inputForm">
                        <input type="password" id="password" class="inputField" placeholder="Password" required>
                    </div>
                    <button type="submit" class="submitButton">Lanjut</button>
                </form>
            </div>
        </div>
    </body>
</html>
