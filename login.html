<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

      
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('file:///C:/Users/ACER/Downloads/Image%20placeholder.png');
            background-size: cover;
            background-position: center;
            filter: blur(3px) grayscale(70%) brightness(0.7); 
            z-index: -1;
        }

       
        .login-card {
            background-color: rgb(255, 255, 255);
            padding: 40px;
            border-radius: 25px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); 
            width: 100%;
            max-width: 600px; 
            box-sizing: border-box; 
            text-align: center;
        }

        .login-card h1 {
            color: #333;
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-field {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px; 
            font-size: 1rem;
            box-sizing: border-box; 
            transition: border-color 0.3s;
        }

        .input-field::placeholder {
            color: #aaa;
        }

        .input-field:focus {
            outline: none;
            border-color: #007bff;
        }

       
        .submit-btn {
            width: 100%;
            padding: 15px;
            background-color: white;
            color: #555;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }

        .submit-btn:hover {
            background-color: #f8f8f8;
            border-color: #bbb;
        }
    </style>
</head>
<body>

    <div class="background-container"></div>

    <div class="login-card">
        <h1>Yuk, masuk untuk melanjutkan!</h1>
        <form>
            <div class="input-group">
                <input type="email" id="email" class="input-field" placeholder="Email Sekolah" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" class="input-field" placeholder="Password" required>
            </div>
            <button type="submit" class="submit-btn">Lanjut</button>
        </form>
    </div>

</body>
</html>
